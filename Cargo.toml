[package]
name = "tierpulse"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework
axum = "0.7.9"
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "limit", "cors", "sensitive-headers"] }

# Inference Engine
ort = { version = "2.0.0-rc.11" } 
ndarray = "0.15.6"
tokenizers = "0.21.0"

# Caching & Optimization
moka = { version = "0.12.8", features = ["future"] }
redis = { version = "0.27.6", features = ["tokio-comp", "json"] }
dashmap = "6.1.0"

# HTTP & API
reqwest = { version = "0.12.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

# Observation & Security
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
governor = "0.6.3" 
nonzero_ext = "0.3.0"
jsonwebtoken = "9.3.0"

# Error Handling
anyhow = "1.0.95"
thiserror = "2.0.11"

# Configuration
dotenvy = "0.15"
uuid = { version = "1.12.1", features = ["v4"] }
chrono = { version = "0.4.39", features = ["serde"] }

[dev-dependencies]
axum-test = "16.0.0"
mockito = "1.4.0"
serde_yaml = "0.9.34"
