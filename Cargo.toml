[package]
name = "tierpulse"
version = "1.3.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
# Web Framework
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.11", features = ["trace", "limit", "cors", "sensitive-headers"] }

# Inference Engine
ort = { version = "2.0.0-rc.11" } 
ndarray = "0.17.2"
tokenizers = "0.23.1"

# Caching & Optimization
moka = { version = "0.12.15", features = ["future"] }
redis = { version = "1.2.2", features = ["tokio-comp", "json"] }
dashmap = "6.2.1"

# HTTP & API
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.150"

# Observation & Security
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
governor = "0.10.4" 
nonzero_ext = "0.3.0"
jsonwebtoken = { version = "10.4.0", features = ["aws_lc_rs"] }

# Error Handling
anyhow = "1.0.102"
thiserror = "2.0.11"

# Configuration
dotenvy = "0.15"
uuid = { version = "1.23.2", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }

[dev-dependencies]
axum-test = "20.1.0"
mockito = "1.4.0"
noyalib = "0.0.5"
